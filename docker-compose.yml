# Local development dependencies. Application containers are built from docker/Dockerfile.*
# in Phase 16; during development the apps run on the host against these services.
name: unigate

services:
  postgres:
    image: postgres:16-alpine
    container_name: unigate-postgres
    environment:
      POSTGRES_USER: unigate
      POSTGRES_PASSWORD: unigate
      POSTGRES_DB: unigate
    ports:
      - "${UNIGATE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once on first init: extensions + test database + the append-only audit role.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unigate -d unigate"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c log_min_duration_statement=250
        -c timezone=UTC

  redis:
    image: redis:7-alpine
    container_name: unigate-redis
    ports:
      - "${UNIGATE_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: unigate-minio
    environment:
      MINIO_ROOT_USER: unigate
      MINIO_ROOT_PASSWORD: unigate-minio
    ports:
      - "${UNIGATE_MINIO_PORT:-9000}:9000"
      - "${UNIGATE_MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the two private buckets on first start; idempotent.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 unigate unigate-minio &&
        mc mb --ignore-existing local/unigate-documents &&
        mc mb --ignore-existing local/unigate-quarantine &&
        mc anonymous set none local/unigate-documents &&
        mc anonymous set none local/unigate-quarantine
      "

  mailhog:
    image: mailhog/mailhog:latest
    container_name: unigate-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  redis-data:
  minio-data:
