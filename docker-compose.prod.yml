# Single-host deployment: every tier as a container on one VM (docs/deployment.md).
#
#   cp .env.deploy.example .env.deploy   # fill in DEPLOY_HOST and the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.deploy up -d --build
#
# The application containers read their configuration from .env.deploy (never from a file inside
# the image). Only the TLS proxy (docker/nginx) and the MailHog viewer publish ports: :443 serves the
# portal and /api, :9443 serves MinIO's presigned URLs, :80 redirects. Certificates come from
# scripts/deploy/make-certs.sh (private CA) or a real issuer, in ./certs. `migrate` runs once
# before the API starts (architecture.md §13: migrations are a pre-deploy job, never boot-time).
name: unigate-prod

x-api-image: &api-image
  image: unigate/api:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: docker/Dockerfile.api
    args:
      GIT_SHA: ${GIT_SHA:-unknown}

x-api-env: &api-env
  env_file: .env.deploy
  environment:
    # Inside the compose network the services are addressed by name; the public values stay in .env.deploy.
    DATABASE_URL: postgresql://${POSTGRES_USER:-unigate}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.deploy}@postgres:5432/${POSTGRES_DB:-unigate}?schema=public
    REDIS_URL: redis://redis:6379
    SMTP_HOST: mailhog
    SMTP_PORT: "1025"
    SMTP_SECURE: "false"
    UNIGATE_SKIP_DOTENV: "true"
    # Server-to-server calls (presigned-URL signing checks, storage HEAD/GET) go through the proxy's certificate.
    NODE_EXTRA_CA_CERTS: /certs/ca.crt
  volumes:
    - ./certs/ca.crt:/certs/ca.crt:ro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unigate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.deploy}
      POSTGRES_DB: ${POSTGRES_DB:-unigate}
    ports:
      # Loopback only: for scripts/db/backup.sh and psql on the host, never for the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unigate} -d ${POSTGRES_DB:-unigate}"]
      interval: 5s
      timeout: 3s
      retries: 20
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c log_min_duration_statement=500
        -c timezone=UTC
        -c max_connections=200
    deploy:
      resources:
        limits:
          memory: 1536M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env.deploy}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env.deploy}
    ports:
      # Console on loopback only (ssh tunnel); the S3 API is reached through the proxy on :9443.
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY} ${STORAGE_SECRET_KEY} &&
        mc mb --ignore-existing local/${STORAGE_BUCKET:-unigate-documents} &&
        mc mb --ignore-existing local/${STORAGE_QUARANTINE_BUCKET:-unigate-quarantine} &&
        mc anonymous set none local/${STORAGE_BUCKET:-unigate-documents} &&
        mc anonymous set none local/${STORAGE_QUARANTINE_BUCKET:-unigate-quarantine}
      "

  # Mail sink until an SMTP relay / SMS vendor is procured (B-9, OQ-10): OTP codes and e-mails
  # land here. Published on the LAN so testers can read them; remove once EMAIL_PROVIDER=smtp.
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "${MAILHOG_PORT:-8025}:8025"

  migrate:
    <<: [*api-image, *api-env]
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: [*api-image, *api-env]
    restart: unless-stopped
    expose:
      - "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1024M

  worker:
    <<: [*api-image, *api-env]
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 768M

  web:
    image: unigate/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env.deploy}
        NEXT_PUBLIC_UPLOAD_ORIGINS: ${NEXT_PUBLIC_UPLOAD_ORIGINS:-}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-ar}
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_UPLOAD_ORIGINS: ${NEXT_PUBLIC_UPLOAD_ORIGINS:-}
      CSP_ENFORCE: ${CSP_ENFORCE:-false}
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    expose:
      - "3001"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${STORAGE_PORT:-9443}:9443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      web:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
