# TLS edge for the single-host deployment (docs/deployment.md).
#
#   :80    → redirect to https
#   :443   → /api/… (REST + Socket.IO at /api/v1/rt/socket.io) to the API, everything else to the web portal
#   :9443  → MinIO (presigned upload / download URLs; the Host header must reach MinIO unchanged
#            because it is part of the signature)
#
# Certificates are mounted at /etc/nginx/certs (scripts/deploy/make-certs.sh, or a real
# certificate once a domain exists — same file names).
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log combined;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    client_max_body_size 25m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_read_timeout 120s;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location /api/ {
            proxy_pass http://api:4000;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://web:3001;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 9443 ssl;
        listen [::]:9443 ssl;
        http2 on;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        ignore_invalid_headers off;

        location / {
            proxy_pass http://minio:9000;
            proxy_connect_timeout 300;
        }
    }
}
